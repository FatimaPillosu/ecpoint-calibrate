[tool.poetry]
name = "ecpoint-calibrate"
version = "1.0.1"
description = "Web GUI for conditional verification and calibration of NWP model outputs"
authors = ["Fatima Pillosu <fatima.pillosu@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "core"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.0"
scipy = "^1.10.1"
attrs = "^23.1.0"
flask = "^2.3.1"
flask-cors = "^3.0.10"
pandas = "^2.0.1"
pyarrow = "^11.0.0"
matplotlib = "^3.7.1"
cartopy = "^0.25"
earthkit-data = "^0.20.0"
earthkit-geo = "^0.5.0"
earthkit-maps = "^0.0.19"
ecmwflibs = "^0.5.3"
cfgrib = "^0.9.10.3"
colour = "^0.1.5"
python-dateutil = "^2.8.2"
requests = "^2.31"


[tool.poetry.group.dev.dependencies]
ipython = "7.*"
pudb = "^2022.1.3"
pytest = "^7.3.1"
pytest-cov = "^4.0.0"
codecov = "^2.1.13"
black = "19.3b0"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
