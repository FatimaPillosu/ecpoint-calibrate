name: Coverage

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/badges/**'
      - 'README.md'

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-github-actions-annotate-failures

      - name: Run tests with coverage
        run: pytest tests/ --cov-report=json --cov-report=term

      - name: Generate coverage badge
        run: |
          python -c "import json,os; d=json.load(open('coverage.json')); t=round(d['totals']['percent_covered']); c='brightgreen' if t>=90 else 'green' if t>=80 else 'yellowgreen' if t>=70 else 'yellow' if t>=60 else 'orange' if t>=50 else 'red'; os.makedirs('.github/badges',exist_ok=True); json.dump({'schemaVersion':1,'label':'coverage','message':f'{t}%','color':c}, open('.github/badges/coverage.json','w')); print('coverage',t,c)"

      - name: Commit badge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --staged --quiet; then
            echo "Coverage unchanged - nothing to commit."
          else
            git commit -m "Update coverage badge [skip ci]"
            git push
          fi
